name: GATE Matrix CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Codebase Security & Verification Pipeline
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: 'AIzaSyAZgywBMPIvD9g2_iWN_b6z7-P8lV7K2xs'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'gatematrix-40566'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'gatematrix-40566.firebaseapp.com'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'gatematrix-40566.firebasestorage.app'
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '772070186583'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:772070186583:web:c1aeed4d84b389335d4d12'

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Secret Security Scanner
        run: npm run check:secrets

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint Linter
        run: npm run lint

      - name: Run Unit & Regression Test Suite
        run: npx vitest run --pool=forks --poolOptions.forks.singleFork

      - name: Verify Next.js Production Build
        run: npm run build
