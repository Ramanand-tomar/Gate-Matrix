name: GATE Matrix CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Codebase Security & Verification Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Secret Security Scanner
        run: npm run check:secrets

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint Linter
        run: npm run lint

      - name: Run Unit & Regression Test Suite
        run: npx vitest run --pool=forks --poolOptions.forks.singleFork

      - name: Verify Next.js Production Build
        run: npm run build
